<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>EWAF — Every Week a Folder</title>
  <desc>A golden folder holds a white calendar on a deep teal tile. A turquoise day marks the weekly rhythm.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#176B70"/><stop offset="1" stop-color="#093E49"/></linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFDB81"/><stop offset="1" stop-color="#F3AE42"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F3EF"/></linearGradient>
  </defs>
  <rect x="64" y="76" width="896" height="896" rx="206" fill="#062C35" opacity=".18"/>
  <rect x="64" y="64" width="896" height="896" rx="206" fill="url(#tile)"/>
  <path id="folder-back" d="M190 368 Q190 320 238 320 H378 Q400 320 414 339 L454 390 H788 Q834 390 834 436 V732 Q834 780 786 780 H238 Q190 780 190 732Z" fill="#D38D32"/>
  <rect x="312" y="272" width="428" height="414" rx="44" fill="#062C35" opacity=".22"/>
  <g id="calendar">
  <rect x="312" y="256" width="428" height="414" rx="44" fill="url(#paper)"/>
  <path d="M356 256 H696 Q740 256 740 300 V350 H312 V300 Q312 256 356 256Z" fill="#58C8BE"/>
  <path d="M398 234 V284 M654 234 V284" stroke="#ECFFF6" stroke-width="24" stroke-linecap="round"/>
  <g fill="#B7D4CF">
    <rect x="354" y="388" width="30" height="30" rx="9"/><rect x="404" y="388" width="30" height="30" rx="9"/><rect x="454" y="388" width="30" height="30" rx="9"/>
    <rect x="554" y="388" width="30" height="30" rx="9"/><rect x="604" y="388" width="30" height="30" rx="9"/><rect x="654" y="388" width="30" height="30" rx="9"/>
  </g>
  <rect x="500" y="380" width="46" height="46" rx="13" fill="#137B77"/>
  <path d="M506 403 L518 413 L534 393" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path id="folder-front" d="M190 476 Q190 450 216 450 H808 Q834 450 834 476 V732 Q834 780 786 780 H238 Q190 780 190 732Z" fill="url(#folder)"/>
