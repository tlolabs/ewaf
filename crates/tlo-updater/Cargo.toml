[package]
name = "tlo-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "Application-independent authenticated GitHub stable release updates"

[dependencies]
base64 = "0.23.1"
ring = "0.17.14"
semver = "1.0"
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tempfile = "3.23"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
