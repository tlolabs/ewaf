name: Native platforms
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p tlo-updater --bin tlo-release
      - run: python3 -m unittest discover -s tests/release -v
      - run: python3 tests/linux/update_receipt_test.py
      - run: python3 script/check_versions.py
      - run: python3 script/check_icons.py
      - run: python3 script/generate_dependency_inventory.py --check
      - name: Verify dependency notices
        run: |
          python3 script/generate_notices.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Check production updater enrollment
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 script/check_update_trust.py
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 script/version.py)"
          if [[ "$TAG" != "v$version" && ! "$TAG" =~ ^v${version//./\\.}-(beta|rc)\.[0-9]+$ ]]; then
            echo "Tag must be v$version or v$version-beta.N/v$version-rc.N." >&2
            exit 1
          fi
          test -f LICENSE || { echo 'Root GPL license is required for a stable release.' >&2; exit 1; }

  macos-arm64:
    uses: ./.github/workflows/build-macos.yml
    with: {runner: macos-26}

  macos-intel:
    uses: ./.github/workflows/build-macos.yml
    with: {runner: macos-15-intel}

  macos-icons:
    needs: [macos-arm64, macos-intel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8
        with:
          pattern: EWAF-macos-*
          path: macos-packages
          merge-multiple: true
      - name: Verify both native icon catalogs on macOS 26
        run: |
          for archive in macos-packages/*.zip; do
            python3 script/validate_package.py "$archive"
          done

  windows-x64:
    uses: ./.github/workflows/build-windows.yml
    permissions: {contents: read}
    with: {runner: windows-2022, arch: x64}

  windows-arm64:
    uses: ./.github/workflows/build-windows.yml
    permissions: {contents: read}
    with: {runner: windows-11-arm, arch: ARM64}

  qt-reference:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install Qt
        run: brew install qt@6
      - name: Build and test Qt reference
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          ./script/test_qt.sh
          ./script/package_qt_reference.sh
      - name: Run actual internal Mac window
        run: '"dist/EWAF Qt Internal.app/Contents/MacOS/EWAF" --ui-smoke'
      - uses: actions/upload-artifact@v4
        with:
          name: internal-qt-reference-osx-arm64
          path: dist/internal-qt-reference-*-osx-arm64.zip
          if-no-files-found: error
          retention-days: 14

  linux-x64:
    uses: ./.github/workflows/build-linux.yml
    permissions: {contents: read}
    with: {runner: ubuntu-24.04}

  linux-arm64:
    uses: ./.github/workflows/build-linux.yml
    permissions: {contents: read}
    with: {runner: ubuntu-24.04-arm}

  attest-windows-x64:
    needs: windows-x64
    if: "!cancelled() && needs.windows-x64.result == 'success' && startsWith(github.ref, 'refs/tags/')"
    uses: ./.github/workflows/attest-package.yml
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    with: {artifact: EWAF-windows-x64, package_pattern: '*.msi'}

  attest-windows-arm64:
    needs: windows-arm64
    if: "!cancelled() && needs.windows-arm64.result == 'success' && startsWith(github.ref, 'refs/tags/')"
    uses: ./.github/workflows/attest-package.yml
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    with: {artifact: EWAF-windows-ARM64, package_pattern: '*.msi'}

  attest-linux-x64:
    needs: linux-x64
    if: "!cancelled() && needs.linux-x64.result == 'success' && startsWith(github.ref, 'refs/tags/')"
    uses: ./.github/workflows/attest-package.yml
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    with: {artifact: EWAF-linux-ubuntu-24.04, package_pattern: '*.AppImage'}

  attest-linux-arm64:
    needs: linux-arm64
    if: "!cancelled() && needs.linux-arm64.result == 'success' && startsWith(github.ref, 'refs/tags/')"
    uses: ./.github/workflows/attest-package.yml
    permissions: {contents: read, actions: read, id-token: write, attestations: write}
    with: {artifact: EWAF-linux-ubuntu-24.04-arm, package_pattern: '*.AppImage'}

  release-macos-arm64:
    needs: macos-arm64
    if: "!cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish verified macos arm64 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish_direct_release.sh macos arm64

  release-macos-x86_64:
    needs: macos-intel
    if: "!cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish verified macos x86_64 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish_direct_release.sh macos x86_64

  release-windows-x64:
    needs: windows-x64
    if: "!cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish verified windows x64 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish_direct_release.sh windows x64

  release-windows-arm64:
    needs: windows-arm64
    if: "!cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish verified windows arm64 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish_direct_release.sh windows arm64

  release-linux-x64:
    needs: linux-x64
    if: "!cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish verified linux x64 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish_direct_release.sh linux x64

  release-linux-arm64:
    needs: linux-arm64
    if: "!cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-24.04
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Publish verified linux arm64 package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/publish_direct_release.sh linux arm64

  release-notes:
    needs: [release-macos-arm64, release-macos-x86_64, release-windows-x64, release-windows-arm64, release-linux-x64, release-linux-arm64]
    if: "!cancelled() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))"
    runs-on: ubuntu-24.04
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Record published platform availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash script/update_direct_release_notes.sh
