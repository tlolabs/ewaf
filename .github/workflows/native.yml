name: Native platforms
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p tlo-updater --bin tlo-release
      - run: python3 -m unittest discover -s tests/release -v
      - run: python3 tests/linux/update_receipt_test.py
      - run: python3 script/check_versions.py
      - run: python3 script/check_icons.py
      - run: python3 script/generate_dependency_inventory.py --check
      - name: Verify dependency notices
        run: |
          python3 script/generate_notices.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Check production updater enrollment
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 script/check_update_trust.py
      - name: Check release tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 script/version.py)"
          if [[ "$TAG" != "v$version" && ! "$TAG" =~ ^v${version//./\\.}-(beta|rc)\.[0-9]+$ ]]; then
            echo "Tag must be v$version or v$version-beta.N/v$version-rc.N." >&2
            exit 1
          fi
          test -f LICENSE || { echo 'Root GPL license is required for a stable release.' >&2; exit 1; }

  macos:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EWAF_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: rustup show
      - run: ./script/build_core.sh
      - run: cargo test --workspace --locked
      - name: Swift unit and integration tests
        run: swift test
      - name: Generated Xcode harness drift
        run: |
          python3 script/generate_xcode_project.py
          git diff --exit-code -- platform/macos/EWAF.xcodeproj
      - name: Native UI tests
        run: ./script/test_ui.sh
      - name: Package
        run: ./script/package.sh
      - name: Record package checksum
        run: |
          for archive in dist/EWAF-*-macos-*.zip; do
            shasum -a 256 "$archive" > "$archive.sha256"
          done
      - name: Verify shared signer and Sparkle compatibility
        run: SPARKLE_SIGN_TOOL="$PWD/build/sparkle/2.9.6/bin/sign_update" cargo test --locked -p tlo-updater --test channel sparkle_and_shared_signer_interoperate -- --ignored
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: EWAF-macos-${{ matrix.runner }}
          path: |
            dist/EWAF-*-macos-*.zip
            dist/EWAF-*-macos-*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: EWAF-development-macos-${{ matrix.runner }}
          path: |
            dist/EWAF-*-macos-*.zip
            dist/EWAF-*-macos-*.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-tests-${{ matrix.runner }}
          path: dist/UITests.xcresult
          retention-days: 14

  macos-icons:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: EWAF-macos-*
          path: macos-packages
          merge-multiple: true
      - name: Verify both native icon catalogs on macOS 26
        run: |
          for archive in macos-packages/*.zip; do
            python3 script/validate_package.py "$archive"
          done

  windows:
    permissions: {contents: read, id-token: write, attestations: write}
    env:
      EWAF_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Use x64 Python for Qt installation on Windows ARM64
        if: matrix.arch == 'ARM64'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.8.0'
          arch: ${{ matrix.arch == 'ARM64' && 'win64_msvc2022_arm64_cross_compiled' || 'win64_msvc2022_64' }}
          setup-python: ${{ matrix.arch != 'ARM64' }}
          extra: ${{ matrix.arch == 'ARM64' && '--autodesktop' || '' }}
      - run: rustup show
      - run: cargo test --workspace --locked
      - name: Package shared Qt application
        shell: pwsh
        run: ./script/package_windows.ps1 -Architecture '${{ matrix.arch }}'
      - name: Build transactional MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          python script/package_windows_msi.py --arch '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'MSI packaging failed' }
      - name: Reject unsigned updater MSI
        shell: pwsh
        run: |
          $package=(Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $hash=(Get-FileHash $package -Algorithm SHA256).Hash
          $errorFile=Join-Path $env:RUNNER_TEMP 'unsigned-msi.json'
          & "dist/windows-${{ matrix.arch }}/updater-installer/ewaf-installer.exe" --verify-only $package $hash 'CN=Untrusted test' (python script/version.py) ('${{ matrix.arch }}'.ToLowerInvariant()) 2> $errorFile
          if ($LASTEXITCODE -eq 0) { throw 'Unsigned MSI was accepted' }
          $failure=Get-Content $errorFile -Raw | ConvertFrom-Json
          if ($failure.code -ne 'signature') { throw "The native signature verifier did not reject the unsigned MSI: $($failure.code)" }
      - name: Attest tagged MSI provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with: {subject-path: 'dist/*.msi'}
      - name: Native updater verification and cancellation
        timeout-minutes: 5
        shell: pwsh
        run: |
          $package=(Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          ./script/test_windows_updates.ps1 -PackageDirectory "dist/windows-${{ matrix.arch }}" -Msi $package -Architecture '${{ matrix.arch }}'
      - name: MSI upgrade and rollback qualification
        shell: pwsh
        run: ./script/test_windows_msi.ps1 -Architecture '${{ matrix.arch }}'
      - name: Shared headless presentation and FFI regressions
        shell: pwsh
        run: |
          cmake --build "build/qt-${{ matrix.arch }}" --config Release --target ewaf_tests
          if ($LASTEXITCODE -ne 0) { throw 'Presentation test build failed' }
          $binDir = if (Test-Path "build/qt-${{ matrix.arch }}/Release/ewaf_tests.exe") { "build/qt-${{ matrix.arch }}/Release" } else { "build/qt-${{ matrix.arch }}" }
          $packageDir = (Resolve-Path "dist/windows-${{ matrix.arch }}").Path
          $qtRoot = if ('${{ matrix.arch }}' -eq 'ARM64') { $env:Qt6_DIR -replace 'msvc2022_64$', 'msvc2022_arm64' } else { $env:Qt6_DIR }
          $env:PATH = "$packageDir;$(Join-Path $qtRoot 'bin');$env:PATH"
          $env:QT_PLUGIN_PATH = $packageDir
          & "$binDir/ewaf_tests.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Presentation tests failed' }
      - name: Windows accessibility and workflow test
        shell: pwsh
        run: powershell -NoProfile -File script/test_windows_ui.ps1 -Executable "dist/windows-${{ matrix.arch }}/EWAF.exe"
      - name: Test per-user install and removal
        shell: pwsh
        run: ./script/test_windows_install.ps1 -PackageDirectory "dist/windows-${{ matrix.arch }}"
      - name: Record MSI checksum
        shell: pwsh
        run: |
          Get-ChildItem dist/*.msi | ForEach-Object {
            $hash=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -NoNewline
          }
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: EWAF-windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  qt-reference:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install Qt
        run: brew install qt@6
      - name: Build and test Qt reference
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          ./script/test_qt.sh
          ./script/package_qt_reference.sh
      - name: Run actual internal Mac window
        run: '"dist/EWAF Qt Internal.app/Contents/MacOS/EWAF" --ui-smoke'
      - uses: actions/upload-artifact@v4
        with:
          name: internal-qt-reference-osx-arm64
          path: dist/internal-qt-reference-*-osx-arm64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    permissions: {contents: read, id-token: write, attestations: write}
    env:
      EWAF_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Native libraries, Qt 6, and test display
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake desktop-file-utils xvfb dbus-x11 at-spi2-core patchelf squashfs-tools libfuse2t64 libx11-6 libice6 libsm6 libfontconfig1 libgl1 libxrandr2 libxi6 libxcursor1 dconf-cli xdg-utils qt6-base-dev qt6-base-dev-tools libqt6widgets6
      - run: rustup show
      - run: cargo test --workspace --locked
      - name: Shared presentation and packaged Linux window tests
        run: xvfb-run -a dbus-run-session -- ./script/test_linux.sh
      - run: ./script/package_linux.sh
      - name: Prepare checksum-pinned AppImage tooling
        run: python3 script/prepare_appimage_tools.py
      - name: Build AppImage
        run: ./script/package_appimage.sh
      - name: Verify AppImage checksum and package output
        run: |
          file=(dist/*.AppImage)
          test -f "${file[0]}"
          sha256sum --check "${file[0]}.sha256"
      - name: Attest tagged AppImage provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with: {subject-path: 'dist/*.AppImage'}
      - name: Install and validate the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/ewaf --core-smoke
          test -f /usr/share/applications/com.tlolabs.ewaf.desktop
          xvfb-run -a dbus-run-session -- /usr/bin/ewaf --ui-smoke
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: EWAF-linux-${{ matrix.runner }}
          path: |
            dist/*.AppImage
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [quality, macos, macos-icons, windows, linux, qt-reference]
    if: "!cancelled() && startsWith(github.ref, 'refs/tags/')"
    runs-on: macos-26
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Find successful platform artifacts
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --paginate --jq '.artifacts[] | select(.expired == false and (.name | startswith("EWAF-"))) | .name' \
            > "$RUNNER_TEMP/ewaf-artifacts"
          if [[ -s "$RUNNER_TEMP/ewaf-artifacts" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download successful platform artifacts
        if: steps.artifacts.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          while IFS= read -r artifact; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" --dir "release-assets/$artifact"
          done < "$RUNNER_TEMP/ewaf-artifacts"
      - name: Publish available verified platform packages
        if: steps.artifacts.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tag="$REF_NAME"
          version="$(python3 script/version.py)"
          if [[ "$tag" != "v$version" && ! "$tag" =~ ^v${version//./\\.}-(beta|rc)\.[0-9]+$ ]]; then
            echo "Tag must be v$version or v$version-beta.N/v$version-rc.N." >&2
            exit 1
          fi
          prerelease=false
          [[ "$tag" == "v$version" ]] || prerelease=true
          mkdir -p release-assets/publish
          while IFS= read -r -d '' file; do
            if [[ "$file" == *.sha256 ]]; then
              package="${file%.sha256}"
              if [[ ! -f "$package" ]]; then
                echo "Checksum has no matching package: $file" >&2
                exit 1
              fi
              expected="$(awk 'NR == 1 { print $1 }' "$file")"
              actual="$(shasum -a 256 "$package" | awk '{ print $1 }')"
              if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ || "$expected" != "$actual" ]]; then
                echo "Checksum mismatch for $package" >&2
                exit 1
              fi
            fi
            cp "$file" "release-assets/publish/$(basename "$file")"
          done < <(find release-assets -path release-assets/publish -prune -o -type f \( -name '*.zip' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.sha256' \) -print0)
          while IFS= read -r -d '' package; do
            if [[ ! -f "$package.sha256" ]]; then
              echo "Package has no checksum sidecar: $package" >&2
              exit 1
            fi
          done < <(find release-assets/publish -type f \( -name '*.zip' -o -name '*.msi' -o -name '*.AppImage' \) -print0)
          if [[ -z "$(find release-assets/publish -type f -print -quit)" ]]; then
            echo "No releasable platform artifacts passed verification; nothing was published."
            exit 0
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            release_args=()
            [[ "$prerelease" == false ]] || release_args+=(--prerelease)
            gh release create "$tag" --target "$SHA" --title "EWAF $tag" \
              --draft \
              --notes "Platform artifacts are published independently after platform-specific verification. Unsigned direct downloads are not authenticated updater releases. Missing platforms remain tracked in the CI/CD failure report." \
              "${release_args[@]}"
          fi
          existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          has_artifact() {
            local file asset suffix expected actual verification_dir
            file="$(find release-assets/publish -type f -name "$1" -print -quit)"
            [[ -n "$file" ]] && return 0
            suffix="${1#\*}"
            while IFS= read -r asset; do
              [[ "$asset" == *"$suffix" ]] || continue
              grep -Fxq "$asset.sha256" <<< "$existing" || continue
              verification_dir="$(mktemp -d "$RUNNER_TEMP/ewaf-release.XXXXXX")"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --pattern "$asset.sha256" --dir "$verification_dir"
              expected="$(awk 'NR == 1 { print $1 }' "$verification_dir/$asset.sha256")"
              actual="$(shasum -a 256 "$verification_dir/$asset" | awk '{ print $1 }')"
              if [[ ! "$expected" =~ ^[[:xdigit:]]{64}$ || "$expected" != "$actual" ]]; then
                echo "Existing release checksum mismatch for $asset" >&2
                exit 1
              fi
              return 0
            done <<< "$existing"
            return 1
          }
          macos_arm64=unavailable
          macos_x64=unavailable
          windows_x64=unavailable
          windows_arm64=unavailable
          linux_x64=unavailable
          linux_arm64=unavailable
          has_artifact '*-macos-arm64.zip' && macos_arm64=available
          has_artifact '*-macos-x86_64.zip' && macos_x64=available
          has_artifact '*-windows-x64.msi' && windows_x64=available
          has_artifact '*-windows-arm64.msi' && windows_arm64=available
          has_artifact '*-linux-x64.AppImage' && linux_x64=available
          has_artifact '*-linux-arm64.AppImage' && linux_arm64=available
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            if grep -Fxq "$name" <<< "$existing"; then
              mkdir -p "$RUNNER_TEMP/existing-assets"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern "$name" --dir "$RUNNER_TEMP/existing-assets"
              if ! cmp -s "$file" "$RUNNER_TEMP/existing-assets/$name"; then
                echo "Existing release asset differs from the verified package: $name" >&2
                exit 1
              fi
              echo "Keeping verified existing release asset: $name"
              continue
            fi
            gh release upload "$tag" "$file"
          done < <(find release-assets/publish -type f -print0)
          gh release view "$tag" --json body --jq .body \
            | python3 script/update_release_notes.py \
                --status "macOS ARM64" "$macos_arm64" \
                --status "macOS x64" "$macos_x64" \
                --status "Windows x64" "$windows_x64" \
                --status "Windows ARM64" "$windows_arm64" \
                --status "Linux x64" "$linux_x64" \
                --status "Linux ARM64" "$linux_arm64" \
            > "$RUNNER_TEMP/release-notes"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes"
          is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" == true ]]; then
            release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -F prerelease="$prerelease" >/dev/null
          fi
