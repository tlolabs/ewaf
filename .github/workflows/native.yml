name: Native platforms
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: rustup show
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p tlo-updater --bin tlo-release
      - run: python3 -m unittest discover -s tests/release -v
      - run: python3 tests/linux/update_receipt_test.py
      - run: python3 script/check_versions.py
      - run: python3 script/check_icons.py
      - run: python3 script/generate_dependency_inventory.py --check
      - name: Verify dependency notices
        run: |
          python3 script/generate_notices.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Production updater enrollment and existing Windows distribution hold
        if: startsWith(github.ref, 'refs/tags/')
        env:
          WINDOWS_DISTRIBUTION_APPROVED: ${{ vars.WINDOWS_DISTRIBUTION_APPROVED }}
        run: python3 script/check_update_trust.py
      - name: Check stable tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$TAG" = "v$(python3 script/version.py)"
          test -f LICENSE || { echo 'Root GPL license is required for a stable release.' >&2; exit 1; }
          test "$(git cat-file -t "refs/tags/$TAG")" = tag || { echo 'Stable release requires an annotated signed tag.' >&2; exit 1; }
          tag_object="$(git rev-parse "refs/tags/$TAG")"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.verification.verified and .verification.reason == "valid" and (.tagger.email == "153565009+TLothian-CC@users.noreply.github.com" or .tagger.email == "153565009+tlolabs@users.noreply.github.com")' | grep -qx true

  macos:
    needs: quality
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EWAF_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: rustup show
      - run: ./script/build_core.sh
      - run: cargo test --workspace --locked
      - name: Swift unit and integration tests
        run: swift test
      - name: Generated Xcode harness drift
        run: |
          python3 script/generate_xcode_project.py
          git diff --exit-code -- platform/macos/EWAF.xcodeproj
      - name: Native UI tests
        run: ./script/test_ui.sh
      - name: Package
        run: ./script/package.sh
      - name: Verify shared signer and Sparkle compatibility
        run: SPARKLE_SIGN_TOOL="$PWD/build/sparkle/2.9.6/bin/sign_update" cargo test --locked -p tlo-updater --test channel sparkle_and_shared_signer_interoperate -- --ignored
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: EWAF-macos-${{ matrix.runner }}
          path: |
            dist/EWAF-*-macos-*.zip
            dist/EWAF-*-macos-*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && matrix.runner == 'macos-26'
        with:
          name: EWAF-development-macos-arm64-unsupported
          path: |
            dist/EWAF-*-macos-*.zip
            dist/EWAF-*-macos-*.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI-tests-${{ matrix.runner }}
          path: dist/UITests.xcresult
          retention-days: 14

  macos-icons:
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: EWAF-macos-*
          path: macos-packages
          merge-multiple: true
      - name: Verify both native icon catalogs on macOS 26
        run: |
          for archive in macos-packages/*.zip; do
            python3 script/validate_package.py "$archive"
          done

  windows:
    needs: quality
    permissions: {contents: read, id-token: write, attestations: write}
    env:
      EWAF_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            arch: ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - run: rustup show
      - run: cargo test --workspace --locked
      - name: Package native application
        shell: pwsh
        run: ./script/package_windows.ps1 -Architecture '${{ matrix.arch }}'
      - name: Authenticate to existing Azure signing account
        if: startsWith(github.ref, 'refs/tags/')
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign EWAF-owned files
        if: startsWith(github.ref, 'refs/tags/')
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}/dist/windows-${{ matrix.arch }}/EWAF.exe
            ${{ github.workspace }}/dist/windows-${{ matrix.arch }}/ewaf_ffi.dll
            ${{ github.workspace }}/dist/windows-${{ matrix.arch }}/ewaf-update.exe
            ${{ github.workspace }}/dist/windows-${{ matrix.arch }}/updater-installer/ewaf-installer.exe
      - name: Build transactional MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          python script/package_windows_msi.py --arch '${{ matrix.arch }}'
          if ($LASTEXITCODE -ne 0) { throw 'MSI packaging failed' }
      - name: Sign MSI with Azure Artifact Signing
        if: startsWith(github.ref, 'refs/tags/')
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: msi
      - name: Verify native MSI identity and signature
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $arch='${{ matrix.arch }}'.ToLowerInvariant()
          Get-ChildItem dist/*.msi | ForEach-Object { python script/update_receipt.py $_.FullName --platform windows --arch $arch; if ($LASTEXITCODE -ne 0) { throw 'MSI verification failed' } }
      - name: Reject unsigned updater MSI
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $package=(Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          $hash=(Get-FileHash $package -Algorithm SHA256).Hash
          $errorFile=Join-Path $env:RUNNER_TEMP 'unsigned-msi.json'
          & "dist/windows-${{ matrix.arch }}/updater-installer/ewaf-installer.exe" --verify-only $package $hash 'CN=Untrusted test' (python script/version.py) ('${{ matrix.arch }}'.ToLowerInvariant()) 2> $errorFile
          if ($LASTEXITCODE -eq 0) { throw 'Unsigned MSI was accepted' }
          $failure=Get-Content $errorFile -Raw | ConvertFrom-Json
          if ($failure.code -ne 'signature') { throw "The native signature verifier did not reject the unsigned MSI: $($failure.code)" }
          exit 0
      - name: Attest production MSI
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with: {subject-path: 'dist/*.msi'}
      - name: Native updater verification and cancellation
        shell: pwsh
        run: |
          $package=(Get-ChildItem dist/*.msi | Select-Object -First 1).FullName
          ./script/test_windows_updates.ps1 -PackageDirectory "dist/windows-${{ matrix.arch }}" -Msi $package -Architecture '${{ matrix.arch }}'
      - name: MSI upgrade and rollback qualification
        shell: pwsh
        run: ./script/test_windows_msi.ps1 -Architecture '${{ matrix.arch }}'
      - name: Test packaged Rust / C# boundary
        shell: pwsh
        run: |
          $env:PATH = "$pwd/dist/windows-${{ matrix.arch }};" + $env:PATH
          dotnet run --project tests/windows/Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Native integration tests failed' }
      - name: WinUI launch and accessibility smoke test
        shell: pwsh
        run: powershell -NoProfile -File script/test_windows_ui.ps1 -Executable "dist/windows-${{ matrix.arch }}/EWAF.exe"
      - name: Test per-user install and removal
        shell: pwsh
        run: ./script/test_windows_install.ps1 -PackageDirectory "dist/windows-${{ matrix.arch }}"
      - name: Capture resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-lock-${{ matrix.arch }}
          path: platform/windows/EWAF/packages.lock.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: EWAF-windows-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.verified.json
          if-no-files-found: error

  linux:
    needs: quality
    permissions: {contents: read, id-token: write, attestations: write}
    env:
      EWAF_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Native libraries and test display
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev libjson-glib-dev desktop-file-utils xvfb dbus-x11 at-spi2-core patchelf squashfs-tools libfuse2t64 adwaita-icon-theme
      - run: rustup show
      - run: cargo test --workspace --locked
      - name: Native widget integration
        run: xvfb-run -a dbus-run-session -- ./script/test_linux.sh
      - run: ./script/package_linux.sh
      - name: Prepare checksum-pinned AppImage tooling
        run: python3 script/prepare_appimage_tools.py
      - name: Import production GPG key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GPG_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_KEY"
          export GNUPGHOME="$RUNNER_TEMP/ewaf-gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build AppImage
        env:
          EWAF_PRODUCTION: ${{ startsWith(github.ref, 'refs/tags/') && '1' || '0' }}
          LINUX_SIGNING_KEY: ${{ vars.LINUX_SIGNING_KEY }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: ./script/package_appimage.sh
      - name: Verify signed AppImage
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          arch=x64; test "$(uname -m)" != aarch64 || arch=arm64
          python3 script/update_receipt.py dist/*.AppImage --platform linux --arch "$arch"
      - name: Attest production AppImage
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v3
        with: {subject-path: 'dist/*.AppImage'}
      - name: Remove isolated GPG keyring
        if: always()
        run: rm -rf "$RUNNER_TEMP/ewaf-gnupg"
      - name: Install and validate the package
        run: |
          sudo apt-get install -y ./dist/*.deb
          /usr/bin/ewaf --core-smoke
          test -f /usr/share/applications/com.tlolabs.ewaf.desktop
          gsettings list-keys com.tlolabs.ewaf
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: EWAF-linux-${{ matrix.runner }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.asc
            dist/*.verified.json
          if-no-files-found: error

  release:
    needs: [quality, macos, macos-icons, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          pattern: EWAF-*
          path: release-assets
          merge-multiple: true
      - name: Import mandatory macOS signing identity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          : "${CERTIFICATE:?Stable releases require a Developer ID certificate}"
          if [[ -n "$CERTIFICATE" ]]; then
            printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ewaf.keychain-db"
            security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ewaf.keychain-db"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ewaf.keychain-db"
            security import "$RUNNER_TEMP/certificate.p12" -k "$RUNNER_TEMP/ewaf.keychain-db" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ewaf.keychain-db"
            security list-keychains -d user -s "$RUNNER_TEMP/ewaf.keychain-db" login.keychain-db
          fi
      - name: Sign and notarize validated macOS artifacts
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${SIGNING_IDENTITY:?Stable releases require Developer ID signing}"
          : "${APPLE_ID:?Stable releases require notarization}"
          : "${APP_PASSWORD:?Missing notarization password}"
          : "${TEAM_ID:?Missing Apple team ID}"
          if [[ -n "$SIGNING_IDENTITY" ]]; then
            for archive in release-assets/*-macos-*.zip; do
              stage="$(mktemp -d)"
              ditto -x -k "$archive" "$stage"
              while IFS= read -r item; do
                codesign --force --options runtime --timestamp --preserve-metadata=entitlements --sign "$SIGNING_IDENTITY" "$item"
              done < <(find "$stage/EWAF.app/Contents/Frameworks/Sparkle.framework" -type f -perm +111)
              for item in "$stage/EWAF.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Downloader.xpc" "$stage/EWAF.app/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/Installer.xpc" "$stage/EWAF.app/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app" "$stage/EWAF.app/Contents/Frameworks/Sparkle.framework" "$stage/EWAF.app"; do
                codesign --force --options runtime --timestamp --preserve-metadata=entitlements --sign "$SIGNING_IDENTITY" "$item"
              done
              codesign --verify --strict "$stage/EWAF.app"
              ditto -c -k --sequesterRsrc --keepParent "$stage/EWAF.app" "$archive"
              if [[ -n "$APPLE_ID" ]]; then
                xcrun notarytool submit "$archive" --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID" --wait
                xcrun stapler staple "$stage/EWAF.app"
                xcrun stapler validate "$stage/EWAF.app"
                ditto -c -k --sequesterRsrc --keepParent "$stage/EWAF.app" "$archive"
              fi
              python3 script/validate_package.py "$archive"
              arch=x64; [[ "$archive" != *-arm64.zip ]] || arch=arm64
              normalized="release-assets/ewaf-$(python3 script/version.py)-macos-$arch.zip"
              mv "$archive" "$normalized"
              python3 script/update_receipt.py "$normalized" --platform macos --arch "$arch"
            done
          fi
      - name: Generate authenticated update metadata
        env:
          TLO_UPDATE_SIGNING_SEED: ${{ secrets.TLO_UPDATE_SIGNING_SEED }}
        run: python3 script/build_update_release.py release-assets
      - name: Attest final release and metadata
        uses: actions/attest-build-provenance@v3
        with: {subject-path: 'release-assets/*'}
      - name: Publish draft stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          tag="$REF_NAME"
          test "$tag" = "v$(python3 script/version.py)"
          if gh release view "$tag" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft" 2>/dev/null; then
            grep -qx true "$RUNNER_TEMP/is-draft" || { echo "Refusing to modify a published release" >&2; exit 1; }
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$SHA" --draft --title "EWAF $tag" --generate-notes
          gh release upload "$tag" release-assets/*
          # Drafts are never visible to production updaters. Publication remains a separate owner action.
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/ewaf.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/ewaf.keychain-db"; fi
          rm -f "$RUNNER_TEMP/certificate.p12"
