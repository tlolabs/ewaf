name: Build macOS
on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
jobs:
  build:
    timeout-minutes: 25
    runs-on: ${{ inputs.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      EWAF_UPDATE_CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'stable' || 'development' }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: rustup show
      - run: ./script/build_core.sh
      - run: cargo test --workspace --locked
      - name: Swift unit and integration tests
        run: swift test
      - name: Generated Xcode harness drift
        run: |
          python3 script/generate_xcode_project.py
          git diff --exit-code -- platform/macos/EWAF.xcodeproj
      - name: Native UI tests
        run: ./script/test_ui.sh
      - name: Package
        run: ./script/package.sh
      - name: Record package checksum
        run: |
          for archive in dist/EWAF-*-macos-*.zip; do
            shasum -a 256 "$archive" > "$archive.sha256"
          done
      - name: Verify shared signer and Sparkle compatibility
        run: SPARKLE_SIGN_TOOL="$PWD/build/sparkle/2.9.6/bin/sign_update" cargo test --locked -p tlo-updater --test channel sparkle_and_shared_signer_interoperate -- --ignored
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: EWAF-macos-${{ inputs.runner }}
          path: |
            dist/EWAF-*-macos-*.zip
            dist/EWAF-*-macos-*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main'
        with:
          name: EWAF-development-macos-${{ inputs.runner }}
          path: |
            dist/EWAF-*-macos-*.zip
            dist/EWAF-*-macos-*.sha256
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: UI-tests-${{ inputs.runner }}
          path: dist/UITests.xcresult
          retention-days: 14
